name: sentinelglobe-security-stack

# Real upstream images. Profiles let you run only what the host can support.
#   core      -> Suricata + Zeek + Cowrie + OpenCanary + Fail2Ban
#   nids      -> Suricata + Zeek
#   honeypot  -> Cowrie + OpenCanary + Conpot + Beelzebub + HFish
#   siem      -> Wazuh
#   deception -> Beelzebub
#   ics       -> Conpot
#   fleet     -> HFish
#   response  -> Fail2Ban
#
# Security Onion and T-Pot are full appliances/OS images and are documented in
# ./appliances instead of being forced into a container.

services:
  suricata:
    image: jasonish/suricata:latest
    container_name: sentinel-suricata
    profiles: [core, nids]
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
    volumes:
      - ./generated/suricata/suricata.yaml:/tmp/sentinel/suricata.yaml:ro
      - ./generated/suricata/sentinel.rules:/tmp/sentinel/sentinel.rules:ro
      - ./logs/suricata:/var/log/suricata
    command: ["-c", "/tmp/sentinel/suricata.yaml", "-i", "${SENTINEL_CAPTURE_IFACE:-eth0}"]
    restart: unless-stopped

  zeek:
    image: zeek/zeek:latest
    container_name: sentinel-zeek
    profiles: [core, nids]
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    volumes:
      - ./generated/zeek/local.zeek:/usr/local/share/zeek/site/local.zeek:ro
      - ./logs/zeek:/logs
    command: ["zeek", "-i", "${SENTINEL_CAPTURE_IFACE:-eth0}", "/usr/local/share/zeek/site/local.zeek"]
    working_dir: /logs
    restart: unless-stopped

  wazuh-manager:
    image: wazuh/wazuh-manager:4.13.0
    container_name: sentinel-wazuh
    profiles: [siem, hids]
    hostname: sentinel-wazuh
    ports:
      - "1514:1514"
      - "1515:1515"
      - "55000:55000"
    volumes:
      - ./generated/wazuh/ossec.conf:/var/ossec/etc/ossec.conf:ro
      - ./generated/wazuh/local_rules.xml:/var/ossec/etc/rules/local_rules.xml:ro
      - ./logs/wazuh:/var/ossec/logs
    restart: unless-stopped

  fail2ban:
    image: crazymax/fail2ban:latest
    container_name: sentinel-fail2ban
    profiles: [core, response]
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    volumes:
      - ./generated/fail2ban/jail.local:/etc/fail2ban/jail.local:ro
      - ./generated/fail2ban/filter.d/cowrie.conf:/etc/fail2ban/filter.d/cowrie.conf:ro
      - ./generated/fail2ban/filter.d/suricata-fast.conf:/etc/fail2ban/filter.d/suricata-fast.conf:ro
      - ./logs:/var/log:ro
      - /var/log:/host/var/log:ro
    environment:
      F2B_LOG_TARGET: STDOUT
      F2B_LOG_LEVEL: INFO
      F2B_DB_PURGE_AGE: 1d
    restart: unless-stopped

  cowrie:
    image: cowrie/cowrie:latest
    container_name: sentinel-cowrie
    profiles: [core, honeypot]
    ports:
      - "2222:2222"
      - "2223:2223"
    volumes:
      - ./generated/cowrie/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
      - ./generated/cowrie/userdb.txt:/cowrie/cowrie-git/etc/userdb.txt:ro
      - ./logs/cowrie:/cowrie/cowrie-git/var/log/cowrie
      - ./logs/cowrie/downloads:/cowrie/cowrie-git/var/lib/cowrie/downloads
    restart: unless-stopped

  opencanary:
    image: thinkst/opencanary:latest
    container_name: sentinel-opencanary
    profiles: [core, honeypot]
    ports:
      - "8081:8081"
      - "2225:2225"
      - "2121:2121"
      - "2323:2323"
    volumes:
      - ./generated/opencanary/opencanary.conf:/etc/opencanaryd/opencanary.conf:ro
      - ./logs/opencanary:/var/log/opencanary
    restart: unless-stopped

  conpot:
    image: honeynet/conpot:latest
    container_name: sentinel-conpot
    profiles: [honeypot, ics]
    ports:
      - "502:5020"
      - "102:10201"
      - "47808:47808/udp"
      - "161:16100/udp"
      - "623:6230/udp"
      - "8800:8800"
    cap_add: [NET_BIND_SERVICE]
    volumes:
      - ./generated/conpot/conpot.cfg:/etc/conpot/conpot.cfg:ro
      - ./logs/conpot:/var/log/conpot
      - ./logs/conpot/data:/tmp/conpot-data
    command: ["/home/conpot/.local/bin/conpot", "--template", "default", "--config", "/etc/conpot/conpot.cfg", "--logfile", "/var/log/conpot/conpot.log", "--temp_dir", "/tmp"]
    restart: unless-stopped

  beelzebub:
    image: beelzebubmaintainer/beelzebub:latest
    container_name: sentinel-beelzebub
    profiles: [honeypot, deception]
    ports:
      - "8082:8082"
      - "2224:2224"
    volumes:
      - ./generated/beelzebub:/app/configurations:ro
      - ./logs/beelzebub:/var/log/beelzebub
    command: ["--conf-core", "/app/configurations/beelzebub.yaml", "--conf-services", "/app/configurations/services"]
    restart: unless-stopped

  hfish:
    image: dskyz/hfish:latest
    container_name: sentinel-hfish
    profiles: [honeypot, fleet]
    ports:
      - "4433:4433"
      - "4434:4434"
      - "7879:7879"
    volumes:
      - ./logs/hfish:/opt/hfish/log
    restart: unless-stopped
