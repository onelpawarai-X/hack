[common]
sensorid = sentinelglobe-conpot

[virtual_file_system]
data_fs_url = osfs:///tmp/conpot-data
fs_url = tar:///home/conpot/.local/lib/python3.6/site-packages/conpot-0.6.0-py3.6.egg/conpot/data.tar

[session]
timeout = 30

[daemon]
;user = conpot
;group = conpot

[json]
enabled = True
filename = /var/log/conpot/conpot.json

[sqlite]
enabled = False

[mysql]
enabled = False

[syslog]
enabled = False

[hpfriends]
enabled = False

[taxii]
enabled = False

[fetch_public_ip]
enabled = False

[change_mac_addr]
enabled = False
